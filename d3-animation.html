<div class="card">

<h2>D3 Circle Interaction</h2>
<p>Click anywhere to create circles</p>

<svg id="canvas" width="800" height="450"></svg>

</div>

<script>

const svg = d3.select("#canvas");

const maxCircles = 10;

let circles = [];

svg.on("click", function(event){

  const coords = d3.pointer(event);

  const newCircle = {
    x: coords[0],
    y: coords[1]
  };

  circles.push(newCircle);

  if(circles.length > maxCircles){
    circles.shift();
  }

  drawCircles();

});

function drawCircles(){

  const selection = svg.selectAll("circle")
  .data(circles);

  selection.enter()
  .append("circle")
  .merge(selection)
  .attr("cx", d => d.x)
  .attr("cy", d => d.y)
  .attr("r", 20)
  .attr("fill", "steelblue");

  selection.exit().remove();

}

</script>
